# Advisories aceptadas explícitamente. Cada entrada documenta por qué no aplica o por qué
# se acepta temporalmente, y qué la resolvería. Revisar en cada actualización de dependencias.
[advisories]
ignore = [
    # rsa 0.9 — Marvin Attack. Ningún binario del workspace compila `rsa`: el código firma con
    # `ring` (en proceso) o con Vault Transit (producción), y
    # `cargo tree -i rsa --workspace --target all -e all` no lo encuentra. Solo figura en
    # Cargo.lock como dependencia de `sqlx-mysql`, que sqlx declara con features débiles
    # aunque el workspace solo active PostgreSQL. Retirar al actualizar sqlx si desaparece.
    "RUSTSEC-2023-0071",

    # webpki-roots 0.26.11 es un "semver trick" que reexporta webpki-roots 1.x; el lockfile
    # resuelve 1.0.10, que ya contiene la corrección. El aviso salta solo por el rango 0.26.x.
    "RUSTSEC-2026-0381",
]
