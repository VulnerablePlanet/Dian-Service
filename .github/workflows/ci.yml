name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las pruebas de integración de infra-postgres crean una base de datos por prueba.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Verificadores independientes: xmlsec1 (firmas XML-DSig) y xmllint (C14N y XSD de UBL).
      # Con CI definido, las pruebas fallan en lugar de omitirse si faltan.
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1 libxml2-utils
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  migrations:
    name: Apply migrations on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "Applying $f"
            psql -h localhost -U postgres -d dian -v ON_ERROR_STOP=1 -q -f "$f"
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
      # La excepción de RUSTSEC-2023-0071 en .cargo/audit.toml solo vale si `rsa` no se compila.
      - name: rsa is not compiled
        run: test -z "$(cargo tree -i rsa --workspace --target all -e all 2>/dev/null)"
