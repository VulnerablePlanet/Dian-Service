[package]
name = "api-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api-server"
path = "src/main.rs"

[dependencies]
core-domain = { path = "../core-domain" }
application = { path = "../application" }
infra-postgres = { path = "../infra-postgres" }
ubl-engine = { path = "../ubl-engine" }
crypto-signer = { path = "../crypto-signer" }
dian-soap-client = { path = "../dian-soap-client" }
observability = { path = "../observability" }
prometheus-client = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
core-domain = { path = "../core-domain", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
